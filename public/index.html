<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Помогатор2К</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="tabs">
      <ul id="tabs-list" class="tabs__list"></ul>
      <div class="tabs__actions">
        <button id="new-chat" class="tabs__new" type="button" title="Новый чат">+</button>
        <button id="summarize" class="tabs__summarize" type="button" title="Подвести итоги всех чатов">Подвести итоги</button>
      </div>
    </aside>

    <div class="chat">
      <main id="messages" class="chat__body"></main>

      <form id="form" class="chat__form">
        <div class="chat__input-wrap">
          <div id="command-menu" class="command-menu" hidden></div>
          <textarea
            id="input"
            class="chat__input"
            rows="1"
            placeholder="Напишите сообщение..."
          ></textarea>
        </div>
        <button id="send" type="submit" class="chat__send">Отправить</button>
      </form>
    </div>

    <aside class="settings">
      <div class="settings__brand">
        <div class="settings__title">Помогатор2К</div>
        <div class="dropdown" id="model-dropdown">
          <button
            type="button"
            class="dropdown__button"
            id="model-button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-label="Модель"
          >
            <span class="dropdown__dot" id="model-dot"></span>
            <span class="dropdown__label" id="model-label">deepseek-v4-flash</span>
            <span class="dropdown__chevron"></span>
          </button>
          <div class="dropdown__menu" id="model-menu" role="listbox" hidden></div>
        </div>
      </div>

      <div class="settings__form">
        <div class="settings__field">
          <label class="settings__label" for="setting-temperature">
            Температура
            <span class="settings__value" id="temperature-value">1</span>
          </label>
          <input
            type="range"
            id="setting-temperature"
            class="settings__range"
            min="0"
            max="2"
            step="0.1"
            value="1"
          />
        </div>

        <div class="settings__field">
          <label class="settings__label" for="setting-top-p">
            top_p
            <span class="settings__value" id="top-p-value">1</span>
          </label>
          <input
            type="range"
            id="setting-top-p"
            class="settings__range"
            min="0"
            max="1"
            step="0.01"
            value="1"
          />
        </div>

        <div class="settings__field">
          <label class="settings__label" for="setting-max-tokens">Лимит токенов</label>
          <input
            type="number"
            id="setting-max-tokens"
            class="settings__input"
            min="1"
            step="1"
            placeholder="Не задано"
          />
        </div>

        <div class="settings__field">
          <label class="settings__label" for="setting-stop">Стоп слова</label>
          <input
            type="text"
            id="setting-stop"
            class="settings__input"
            placeholder="Не задано"
          />
        </div>

        <div class="settings__field">
          <span class="settings__label">Режим ответа</span>
          <div class="settings__switch-row">
            <label class="settings__switch">
              <input type="checkbox" id="setting-mode" checked />
              <span class="settings__switch-slider"></span>
            </label>
            <span class="settings__mode-state" id="mode-state">Обычный</span>
          </div>
          <p class="settings__hint">вкл — обычный ответ, выкл — строгий JSON</p>
        </div>
      </div>
    </aside>
  </div>

  <div id="command-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="Оптимизация промпта">
      <div class="modal__header">
        <span class="modal__title">Оптимизация промпта</span>
        <button id="modal-close" type="button" class="modal__close" aria-label="Закрыть">×</button>
      </div>
      <div id="modal-body" class="modal__body">
        <pre id="modal-result" class="modal__result"></pre>
      </div>
      <div id="modal-stats" class="modal__stats"></div>
      <div class="modal__footer">
        <button id="modal-copy" type="button" class="modal__copy">Копировать</button>
        <button id="modal-close-btn" type="button" class="modal__close-btn">Закрыть</button>
      </div>
    </div>
  </div>

  <footer class="statusbar">
    Сожжено токенов: <span id="tokens-total" class="statusbar__value">0</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
