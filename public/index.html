<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Помогатор2К</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="chat">
      <header class="chat__header">
        <select id="model-select" class="chat__model" aria-label="Модель">
          <option value="deepseek-chat">deepseek-chat</option>
        </select>
      </header>

      <main id="messages" class="chat__messages"></main>

      <form id="form" class="chat__form">
        <textarea
          id="input"
          class="chat__input"
          rows="1"
          placeholder="Напишите сообщение..."
        ></textarea>
        <button id="send" type="submit" class="chat__send">Отправить</button>
      </form>
    </div>

    <aside class="settings">
      <div class="settings__title">Помогатор2К</div>
      <div class="settings__divider"></div>

      <div class="settings__form">
        <div class="settings__field">
          <label class="settings__label" for="setting-max-tokens">Лимит токенов</label>
          <input
            type="number"
            id="setting-max-tokens"
            class="settings__input"
            min="1"
            step="1"
            placeholder="Не задано"
          />
        </div>

        <div class="settings__field">
          <label class="settings__label" for="setting-stop">Стоп слова</label>
          <input
            type="text"
            id="setting-stop"
            class="settings__input"
            placeholder="Не задано"
          />
        </div>

        <div class="settings__field">
          <span class="settings__label">Режим ответа</span>
          <div class="settings__switch-row">
            <label class="settings__switch">
              <input type="checkbox" id="setting-mode" checked />
              <span class="settings__switch-slider"></span>
            </label>
            <span class="settings__mode-state" id="mode-state">Обычный</span>
          </div>
          <p class="settings__hint">вкл — обычный ответ, выкл — строгий JSON</p>
        </div>
      </div>
    </aside>
  </div>

  <footer class="statusbar">
    Сожжено токенов: <span id="tokens-total" class="statusbar__value">0</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
